name: first workflow
on: 
  push:
  pull_request:
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        
      - name: "Setup node js in vm"
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run eslint
        run: npm run lint
        
      - name: run test cases
        run: npm run test  
      
      - name: Build React app
        run: npm run build

      - name: create artifacts
        uses: actions/upload-artifact@v3
        with:
          name: react-build
          path: /dist
          retention-days: 5

        

